# casa-build — construye la imagen que corre el NAS desde la rama `casa`.
#
# Tags publicados en ghcr.io/paulorichards/romarr:
#   1.6.0-casa.N   ← el que fija nas-gitops
#   casa           ← flotante, para probar
# 1.6.0 sale de .casa/base (el release de upstream debajo de casa) y N es el
# número de corrida, siempre creciente.
#
# Sólo linux/amd64: el NAS es un J3455. Sin despliegue automático: el stack se
# actualiza a mano desde nas-gitops (ver stacks/romarr/README.md).
name: casa-build

on:
  push:
    branches: [casa]
  workflow_dispatch:

concurrency:
  group: casa-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q

  build:
    needs: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Versión
        id: v
        run: |
          version="$(cat .casa/base)"
          echo "tag=${version}-casa.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}
            ${{ steps.v.outputs.image }}:casa
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=casa
          cache-to: type=gha,mode=max,scope=casa

      - name: Resumen
        run: echo "Publicado \`${{ steps.v.outputs.image }}:${{ steps.v.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  avisar-falla:
    needs: [pytest, build]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "casa-build falló en $(echo "$GITHUB_SHA" | cut -c1-7)" \
            --body "No salió imagen nueva; el NAS sigue en la anterior. Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
